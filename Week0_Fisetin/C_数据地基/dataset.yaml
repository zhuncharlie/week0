# C 岗 · 最小数据集描述(solo 版,覆盖范围=这次我实际产出的全部文件)

project: Week0_Fisetin_Pilot
owner: zhuncharlie (solo,覆盖 A1/A2/B/C/D 多个工位的最小必要产出)
updated: 2026-10-30

inputs:
  papers:
    - path: inputs/Fisetin2018.pdf
      desc: Yousefzadeh et al. 2018, EBioMedicine 36:18-28, 主论文(CC BY-NC-ND 4.0)
  task_docs:
    - inputs/Week0_任务交代与完成标准.md
    - inputs/Week0_手册_论文配套版.md

external_apis:
  # 没有DrugBank账号,全部改用免登录的公开REST API,全部可编程重跑
  - name: PubChem PUG REST
    base_url: https://pubchem.ncbi.nlm.nih.gov/rest/pug
    used_for: Fisetin基本属性(CID/SMILES/分子式)
  - name: ChEMBL REST API
    base_url: https://www.ebi.ac.uk/chembl/api/data
    used_for: 分子信息、mechanism(已验证机制)、activity(实测活性)、target、drug_indication
  - name: Open Targets GraphQL (部分使用,schema对不上未深入)
    base_url: https://api.platform.opentargets.org/api/v4/graphql
    used_for: 靶点搜索交叉验证(本轮只验证了target search,knownDrugs字段名在当前schema下已变更)
  - name: DrugAge (genomics.senescence.info)
    status: 尝试访问,无公开REST API(search.php返回404),只能手动浏览网页,本轮未完成——留给下一轮

raw_cache:
  dir: Week0_Fisetin/C_数据地基/raw_cache/
  desc: >
    所有被报告直接引用的API原始JSON响应,已提交进仓库(不是放在/tmp临时目录),
    每条报告结论都能回溯到这里的某个文件 + fisetin_profile.md/candidate_table.tsv里对应的source_url。
    只收录被实际引用的查询结果,没有引用过的探索性查询(比如DrugAge的404页面、
    PubChem完整PUG View大JSON里没用到的章节)没有收进来,避免堆废数据。

outputs:
  - path: Week0_Fisetin/A1_靶点图谱/zhuncharlie/REPORT.md
    desc: 主报告(★入口文件,先看这个)
  - path: Week0_Fisetin/A1_靶点图谱/zhuncharlie/fisetin_profile.md
    desc: Fisetin档案,按手册修正后的phenotypic/SCAPs-network schema
  - path: Week0_Fisetin/A1_靶点图谱/zhuncharlie/fisetin_graph.json
    desc: 节点+边的网络图谱,含证据档位
  - path: Week0_Fisetin/candidate_table.tsv
    desc: 10个候选药(含3个必填对照行),全组共用格式
  - path: Week0_Fisetin/A2_分子相似/zhuncharlie/real_smiles.json
    desc: 候选药规范SMILES,直接从ChEMBL molecule API抓取,similarity.py的唯一结构数据来源
  - path: Week0_Fisetin/A2_分子相似/zhuncharlie/similarity.py
    desc: Tanimoto结构相似度 + 通路/安全/新鲜度打分脚本
  - path: Week0_Fisetin/A2_分子相似/zhuncharlie/scores.tsv
    desc: similarity.py的运行输出(表格),Top1=Venetoclax
  - path: Week0_Fisetin/A2_分子相似/zhuncharlie/scores_chart.png
    desc: scores.tsv的条形图版本,由plot_scores.py生成,REPORT.md §4内嵌
  - path: Week0_Fisetin/A1_靶点图谱/zhuncharlie/fisetin_network.png
    desc: fisetin_graph.json的渲染图,由plot_graph.py生成,满足§7 A1"画成小图"的要求,REPORT.md §2内嵌

reproduce:
  steps:
    - "1. bash run.sh  # 重新拉取ChEMBL/PubChem原始数据到本地临时目录做交叉验证(需要联网,不会覆盖raw_cache/)"
    - "2. cd ../A2_分子相似/zhuncharlie && python3 similarity.py  # 用real_smiles.json重新生成 scores.tsv"
    - "3. cd ../A2_分子相似/zhuncharlie && python3 plot_scores.py  # 重新生成 scores_chart.png"
    - "4. cd ../A1_靶点图谱/zhuncharlie && python3 plot_graph.py  # 重新生成 fisetin_network.png"
  known_dependencies:
    - python3 (3.10+)
    - rdkit (pip install rdkit)
    - requests
    - matplotlib, networkx (只有第3/4步画图需要)
    - 中文字体 Noto Sans SC(系统默认的DejaVu Sans不含中文字形,否则图里中文会大片缺字)。
      本机没有系统级CJK字体,是临时从
      https://fonts.gstatic.com/s/notosanssc/v41/k3kCo84MPvpLmixcA63oeAL7Iqp5IZJF9bmaG9_FnYw.ttf
      (Regular)和同目录…GzjCnYw.ttf(Bold)下载到 ~/.fonts/ 并在脚本里用
      matplotlib.font_manager.addfont() 注册的——字体文件没有提交进仓库(各10MB,体积不值得),
      换机器重跑画图脚本前记得先下好字体,否则图里中文会大片消失(不是报错,是静默丢字,
      这是我这次踩的一个坑:curl -m 30 超时截断了字体文件下载,文件大小对不上但matplotlib
      不报错,后来比对Content-Length才查出来)
  known_limitations:
    - DrugBank数据完全缺失(无账号),已用ChEMBL mechanism/activity替代,但二者不是同一套curation标准,不能完全等价
    - Open Targets knownDrugs字段在当前API版本下查询失败,未排查修复
    - GeneAge/CellAge/DrugAge未能程序化访问,本轮只读了论文和ChEMBL/PubChem
